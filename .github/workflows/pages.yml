name: Publish Beyond the Realm

on:
  push:
    branches: [main]
    paths:
      - 'Beyond_the_Realm_Major_Overhaul.zip'
      - '.github/workflows/pages.yml'
      - '.github/scripts/site_reflection.py'
      - '.github/scripts/site_d2kicker.py'
      - '.github/scripts/site_clones.py'
      - '.github/scripts/site_ladder_history.py'
      - 'assets/screenshots/JayOfTerror_D2Kicker_2007.webp'
      - 'googlee03cbd9c4060257e.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack website
        run: |
          mkdir -p _site
          unzip -q Beyond_the_Realm_Major_Overhaul.zip -d temp-site
          cp -R temp-site/Beyond_the_Realm/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          cp googlee03cbd9c4060257e.html _site/googlee03cbd9c4060257e.html

      - name: Apply closing reflection
        run: python3 .github/scripts/site_reflection.py

      - name: Include D2Kicker screenshot
        run: |
          mkdir -p _site/assets/screenshots
          cp assets/screenshots/JayOfTerror_D2Kicker_2007.webp _site/assets/screenshots/

      - name: Apply D2Kicker history
        run: python3 .github/scripts/site_d2kicker.py

      - name: Add clone research and Stun details
        run: python3 .github/scripts/site_clones.py

      - name: Apply recovered ladder and research history
        run: python3 .github/scripts/site_ladder_history.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
